# This message is sent when the isis neighbor is up
#Jul 27 18:35:13 HOSTNAME Isis: Instance 0: %ISIS-4-ISIS_ADJCHG: L2 Neighbor State Change for SystemID 2080.6521.2080 on et5 to UP
#Sep 15 15:14:12 HOSTNAME Isis: Instance 0: %ISIS-4-ISIS_ADJCHG: L2 Neighbor State Change for 1851.1605.6061 (AR-7280SR248YC6-I-1-LDP11-GB) on Et52/1 to UP
messages:
  - error: ISIS_NEIGHBOR_UP
    tag: ISIS-4-ISIS_ADJCHG
    values:
      neighbor: (\S+)
      interface: (\S+)
      level: (L\d)
    line: '{level} Neighbor State Change for SystemID {neighbor} on {interface} to UP'
    model: openconfig-isis
    mapping:
      static:
        network-instances//network-instance//global//protocols//protocol//isis//interfaces//interface//{interface}//levels//level//{level}//adjacencies//adjacency//{neighbor}//state//adjacency-state: UP
      variables: {}
  - error: ISIS_NEIGHBOR_UP
    tag: ISIS-4-ISIS_ADJCHG
    values:
      neighbor: (\S+)
      interface: (\S+)
      level: (L\d)
    line: '{level} Neighbor State Change for {neighbor} on {interface} to UP'
    model: openconfig-isis
    mapping:
      static:
        network-instances//network-instance//global//protocols//protocol//isis//interfaces//interface//{interface}//levels//level//{level}//adjacencies//adjacency//{neighbor}//state//adjacency-state: UP
      variables: {}
  - error: ISIS_NEIGHBOR_UP
    tag: ISIS-4-ISIS_ADJCHG
    values:
      neighbor: (\S+)
      interface: (\S+)
      peername: (\S+)
      level: (L\d)
    line: '{level} Neighbor State Change for {neighbor} ({peername}) on {interface} to UP'
    model: openconfig-isis
    mapping:
      static:
        network-instances//network-instance//global//protocols//protocol//isis//interfaces//interface//{interface}//levels//level//{level}//adjacencies//adjacency//{neighbor}//state//adjacency-state: UP
      variables: {}
